<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bowstack">
  <title>Bowstack</title>
  <!-- Drafting vellum ground, matching the site -->
  <rect width="512" height="512" fill="#E9EBE5"/>

  <!-- Three rack units. The top one is redlined: the unit being commissioned. -->
  <g>
    <rect x="96" y="120" width="320" height="76" rx="6" fill="#A8402A"/>
    <rect x="96" y="218" width="320" height="76" rx="6" fill="#1D2229"/>
    <rect x="96" y="316" width="320" height="76" rx="6" fill="#1D2229"/>
  </g>

  <!-- Mounting holes, left rail -->
  <g fill="#E9EBE5">
    <circle cx="128" cy="158" r="11"/>
    <circle cx="128" cy="256" r="11"/>
    <circle cx="128" cy="354" r="11"/>
  </g>
</svg>
